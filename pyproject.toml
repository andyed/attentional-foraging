[project]
name = "attentional-foraging"
version = "0.1.0"
description = "Search-process research on AdSERP gaze, cursor, scroll and pupil recordings, with the AllSERP typed AOI pipeline"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "lightgbm>=4.0.0",
    "matplotlib>=3.10.8",
    "matplotlib-venn>=1.1.0",
    "mistune>=3.2.0",
    "numpy>=2.4.4",
    "pandas>=3.0.5",
    "pillow>=12.1.1",
    "playwright>=1.62.0",
    "polars>=1.39.3",
    "pywavelets>=1.9.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
]

[project.optional-dependencies]
learned-baselines = [
    "torch>=2.8,<3",
]
