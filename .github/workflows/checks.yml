# Checks that need no AdSERP data. Most producer tests read the separately
# downloaded dataset and run locally (see scripts/attention_atlas/README.md);
# add a test here once it runs from repository files alone.
name: checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    # Pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19; change the image here, deliberately.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Exact release: setup-uv publishes no v10 major tag.
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install the locked environment
        run: uv sync --frozen --python 3.13
      - name: Attention-atlas tests and verification
        run: uv run python -m unittest discover -s scripts -p test_attention_atlas.py
      - name: Python syntax
        run: uv run python -m compileall -q scripts notebooks-v2/data_loader.py
      - name: Citation metadata
        run: uvx cffconvert --validate -i CITATION.cff
      - name: Site builder syntax
        run: node --check scripts/build-gh-pages.js
